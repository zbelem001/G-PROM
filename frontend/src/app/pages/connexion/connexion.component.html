<main class="flex-grow flex items-center justify-center w-full px-6 py-12 bg-surface-container-low min-h-screen">
  <div class="max-w-md w-full space-y-8">
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-surface-container-lowest shadow-[0_6px_24px_rgba(26,46,68,0.08)] mb-6 overflow-hidden">
        <img
          alt="G-PROM Logo"
          class="w-12 h-12 object-contain"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqkCrdm7RrwkoizlhmLTyipZ3IxkoDLaMRnaH8pPui7f_lwIvSVO2W_h6dL7nM-8tifcN-ouuPfvA0UUPedULjlOt6EgdhtlHLAaJS5qvgFh8Y4Jqx-usTbGqK17glry4UblUPXi9L6P6zk29Phi3VcFoEf47y4_AP2RwiEdlCu69dRgRxdGKTD5DVWIPRAYVTrgvsiVWk4N4_Tu56nd3lQRswJX5UAhI1PsJVuvyy0zibTydEj_8fbEl0GRb1fXZhzsQ_I0dN7ND5"
        />
      </div>
      <h1 class="text-[28px] font-extrabold text-[#1a2e44] tracking-tight">G-PROM</h1>
      <p class="text-secondary font-medium text-sm tracking-wide opacity-80 uppercase">Institut 2iE</p>
    </div>

    <div class="bg-surface-container-lowest rounded-[16px] shadow-[0_6px_24px_rgba(26,46,68,0.08)] p-10">
      <form class="space-y-6" method="POST" (submit)="onSubmit($event)">
        <div>
          <label class="block text-sm font-bold text-[#1a2e44] mb-2 tracking-tight" for="username">Identifiant</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-outline-variant text-[20px]">person</span>
            </div>
            <input
              class="block w-full pl-10 pr-3 py-3 bg-surface-container-highest border-none rounded-[10px] text-on-surface placeholder-outline focus:ring-2 focus:ring-on-primary-container/20 focus:bg-surface-container-lowest transition-all duration-200"
              id="username"
              name="username"
              placeholder="Nom d'utilisateur"
              required
              type="text"
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-[#1a2e44] mb-2 tracking-tight" for="password">Mot de passe</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-outline-variant text-[20px]">lock</span>
            </div>
            <input
              class="block w-full pl-10 pr-3 py-3 bg-surface-container-highest border-none rounded-[10px] text-on-surface placeholder-outline focus:ring-2 focus:ring-on-primary-container/20 focus:bg-surface-container-lowest transition-all duration-200"
              id="password"
              name="password"
              placeholder="••••••••"
              required
              type="password"
            />
          </div>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input
              class="h-4 w-4 text-on-primary-container focus:ring-on-primary-container border-outline-variant rounded"
              id="remember-me"
              name="remember-me"
              type="checkbox"
            />
            <label class="ml-2 block text-sm text-secondary font-medium" for="remember-me">Se souvenir de moi</label>
          </div>
          <div class="text-sm">
            <a class="font-medium text-secondary hover:text-[#1a2e44] transition-colors" href="#">Mot de passe oublié ?</a>
          </div>
        </div>

        <div>
          <button
            class="liquid-gradient w-full flex justify-center py-3.5 px-4 rounded-[10px] text-[#1a2e44] font-bold text-md shadow-md hover:shadow-lg active:scale-95 transition-all duration-300"
            type="submit"
          >
            Connexion
          </button>
        </div>
      </form>

      <div class="mt-8 pt-8 border-t border-surface-container-high/50 text-center">
        <p class="text-sm text-secondary">Accès réservé au personnel autorisé</p>
      </div>
    </div>

    <div class="text-center mt-6">
      <div class="flex items-center justify-center space-x-1">
        <span class="material-symbols-outlined text-on-primary-container/60 text-[18px]">shield</span>
        <span class="text-xs font-medium text-secondary/70">Système d'archivage sécurisé</span>
      </div>
    </div>
  </div>
</main>

<footer class="bg-[#f3f3f5] dark:bg-slate-950 flex flex-col md:flex-row justify-between items-center px-12 py-6 w-full font-['Inter'] text-[14px] leading-relaxed">
  <div class="text-[#1a2e44] dark:text-slate-300 mb-4 md:mb-0">© 2024 Institut 2iE - G-PROM Architectural Ledger</div>
  <div class="flex gap-8">
    <a class="text-slate-500 hover:text-[#1a2e44] hover:underline transition-all opacity-80 hover:opacity-100" href="#">Mentions Légales</a>
    <a class="text-slate-500 hover:text-[#1a2e44] hover:underline transition-all opacity-80 hover:opacity-100" href="#">Assistance</a>
    <a class="text-slate-500 hover:text-[#1a2e44] hover:underline transition-all opacity-80 hover:opacity-100" href="#">Confidentialité</a>
  </div>
</footer>
