<aside class="fixed left-0 top-2 bottom-2 w-[240px] rounded-r-[20px] bg-white z-50 flex flex-col py-8 font-['Manrope'] antialiased shadow-[0_6px_24px_rgba(26,46,68,0.08)]">
  <div class="px-6 mb-8">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center">
        <span class="material-symbols-outlined text-[#76d3c8]">domain</span>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tight">
          <span class="text-[#76d3c8]">G-</span>
          <span class="text-red-500">P</span>
          <span class="text-yellow-500">R</span>
          <span class="text-green-500">O</span>
          <span class="text-blue-500">M</span>
        </h1>
        <p class="text-xs text-slate-400">Institut 2iE</p>
      </div>
    </div>
  </div>
  <nav class="flex-1 flex flex-col gap-2">
    <a routerLink="" routerLinkActive="text-white bg-[#007a6c]" [routerLinkActiveOptions]="{ exact: true }" class="relative flex items-center gap-3 px-6 py-3 text-slate-700 font-bold hover:text-slate-900 hover:bg-slate-100 rounded-[12px] transition-all duration-200 scale-95 active:scale-100 transition-transform">
      <span class="material-symbols-outlined">dashboard</span>
      <span class="text-sm">Dashboard</span>
    </a>
    <a routerLink="/marches" routerLinkActive="text-white bg-[#007a6c]" class="flex items-center gap-3 px-6 py-3 text-slate-700 font-bold hover:text-slate-900 hover:bg-slate-100 rounded-[12px] transition-all duration-200 scale-95 active:scale-100 transition-transform">
      <span class="material-symbols-outlined">inventory_2</span>
      <span class="text-sm">Marchés</span>
    </a>
    <a routerLink="/fournisseurs" routerLinkActive="text-white bg-[#007a6c]" class="flex items-center gap-3 px-6 py-3 text-slate-700 font-bold hover:text-slate-900 hover:bg-slate-100 rounded-[12px] transition-all duration-200 scale-95 active:scale-100 transition-transform">
      <span class="material-symbols-outlined">groups</span>
      <span class="text-sm">Fournisseurs</span>
    </a>
    <a class="flex items-center gap-3 px-6 py-3 text-slate-700 font-bold hover:text-slate-900 hover:bg-slate-100 transition-colors transition-all duration-200 scale-95 active:scale-100 transition-transform" href="#">
      <span class="material-symbols-outlined">assessment</span>
      <span class="text-sm">Rapports</span>
    </a>
    <a class="flex items-center gap-3 px-6 py-3 text-slate-700 font-bold hover:text-slate-900 hover:bg-slate-100 transition-colors transition-all duration-200 scale-95 active:scale-100 transition-transform" href="#">
      <span class="material-symbols-outlined">insights</span>
      <span class="text-sm">Suivi marchés</span>
    </a>
    <a class="flex items-center gap-3 px-6 py-3 text-slate-700 font-bold hover:text-slate-900 hover:bg-slate-100 transition-colors transition-all duration-200 scale-95 active:scale-100 transition-transform" href="#">
      <span class="material-symbols-outlined">settings</span>
      <span class="text-sm">Paramètres</span>
    </a>
  </nav>
  <div class="px-6 mt-auto pt-6">
    <div class="flex items-center justify-center">
      <img src="/2ielogo.png" alt="2iE logo" class="h-32 w-auto object-contain" />
    </div>
  </div>
</aside>
