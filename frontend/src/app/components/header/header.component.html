<header class="fixed top-2 left-[270px] right-8 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl shadow-[0_4px_12px_rgba(26,46,68,0.04)] rounded-[16px] border border-slate-200/70 dark:border-slate-700/50 font-['Manrope'] text-sm font-semibold flex justify-end items-center px-8 py-4">
  <div class="flex items-center gap-4 text-[#1a2e44] dark:text-[#76d3c8]">
    <button class="p-2 hover:bg-[#f3f3f5] dark:hover:bg-slate-800 rounded-lg transition-colors relative">
      <span class="material-symbols-outlined text-slate-500">notifications</span>
      <span class="absolute top-2 right-2 w-2 h-2 bg-error rounded-full"></span>
    </button>
    <button class="p-2 hover:bg-[#f3f3f5] dark:hover:bg-slate-800 rounded-lg transition-colors">
      <span class="material-symbols-outlined text-slate-500">help_outline</span>
    </button>
    <div class="flex items-center gap-2 ml-2" [title]="displayName ? displayName + (role ? ' — ' + role : '') : ''">
      <div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center border-[0.5px] border-outline-variant/20 shrink-0">
        <span class="font-headline font-bold text-on-secondary-container text-xs">{{ initials }}</span>
      </div>
      <div *ngIf="displayName" class="hidden md:flex flex-col leading-tight">
        <span class="text-xs font-bold text-[#1a2e44] dark:text-[#76d3c8]">{{ displayName }}</span>
        <span class="text-[10px] font-medium text-slate-400">{{ role }}</span>
      </div>
    </div>
  </div>
</header>
