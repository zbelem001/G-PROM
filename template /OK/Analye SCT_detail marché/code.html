<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Enregistrer l'Analyse SCT - G-PROM</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#74777d",
                        "on-secondary-container": "#51647d",
                        "on-tertiary-container": "#5692ff",
                        "on-secondary-fixed": "#061d32",
                        "on-tertiary-fixed": "#001a42",
                        "secondary-fixed-dim": "#b4c8e4",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#d8e2ff",
                        "surface-container": "#eeeef0",
                        "surface-container-highest": "#e2e2e4",
                        "surface-container-low": "#f3f3f5",
                        "background": "#f9f9fb",
                        "surface-tint": "#006a62",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f0f0f2",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "primary-fixed": "#96f3e7",
                        "primary-container": "#00332f",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e2e2e4",
                        "on-surface": "#1a1c1d",
                        "on-primary": "#ffffff",
                        "surface": "#f9f9fb",
                        "surface-dim": "#d9dadc",
                        "secondary-fixed": "#d1e4ff",
                        "on-primary-fixed": "#00201d",
                        "surface-bright": "#f9f9fb",
                        "surface-container-high": "#e8e8ea",
                        "on-primary-container": "#43a399",
                        "tertiary-fixed-dim": "#adc6ff",
                        "inverse-primary": "#79d6cb",
                        "secondary-container": "#cde1fe",
                        "on-surface-variant": "#43474d",
                        "on-background": "#1a1c1d",
                        "tertiary-container": "#002b63",
                        "tertiary": "#00173c",
                        "primary": "#001c1a",
                        "on-secondary": "#ffffff",
                        "secondary": "#4c6078",
                        "outline-variant": "#c4c6cd",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#35485f",
                        "on-primary-fixed-variant": "#00504a",
                        "primary-fixed-dim": "#79d6cb",
                        "on-tertiary-fixed-variant": "#004395",
                        "inverse-surface": "#2f3132"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* The Liquidity Gradient */
        .btn-primary {
            background: linear-gradient(135deg, #76d3c8 0%, #43a399 100%);
            border-radius: 10px;
            color: white;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            box-shadow: 0 6px 24px rgba(26, 46, 68, 0.15);
            background: linear-gradient(135deg, #65c2b7 0%, #329288 100%);
        }

        /* Ghost Border for Inputs */
        .input-ghost {
            background-color: var(--surface-container-highest, #e2e2e4);
            border-radius: 10px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .input-ghost:focus-within {
            background-color: var(--surface-container-lowest, #ffffff);
            border-color: rgba(118, 211, 200, 0.2); /* primary ghost border */
            outline: none;
            box-shadow: 0 4px 12px rgba(26, 46, 68, 0.04);
        }
        
        .input-field {
            width: 100%;
            background: transparent;
            border: none;
            padding: 0.75rem 1rem;
            color: var(--on-surface);
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
        }
        .input-field:focus {
            outline: none;
            box-shadow: none;
        }
        
        /* Custom Scrollbar for the drawer */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: var(--surface-variant);
            border-radius: 20px;
        }

        /* Ambient Shadows */
        .shadow-ambient {
            box-shadow: 0 6px 24px rgba(26, 46, 68, 0.08);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body h-screen w-screen overflow-hidden flex relative">
<!-- Main Canvas (Background context to show the drawer overlaying) -->
<div class="flex-1 ml-[240px] pt-24 px-8 pb-8 opacity-40 transition-opacity">
<div class="max-w-6xl mx-auto space-y-8">
<h1 class="font-headline text-3xl font-bold text-secondary">Marchés</h1>
<div class="bg-surface-container-low p-8 rounded-xl min-h-[400px]">
<!-- Background content placeholder -->
</div>
</div>
</div>
<!-- Overlay -->
<div aria-hidden="true" class="fixed inset-0 bg-secondary/10 backdrop-blur-[2px] z-40 transition-opacity duration-300"></div>
<!-- NavigationDrawer (Side Panel) -->
<aside class="fixed right-0 top-0 h-full w-[450px] z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur-2xl shadow-[-20px_0_40px_rgba(26,46,68,0.15)] flex flex-col p-10 gap-8 slide-in-from-right duration-500 ease-out font-['Manrope'] text-slate-900 dark:text-slate-100 overflow-y-auto custom-scrollbar">
<!-- Header -->
<div class="flex items-start justify-between shrink-0 mb-8">
<div class="space-y-2">
<h2 class="text-[22px] font-bold font-headline leading-tight tracking-tight text-secondary">Enregistrer l'Analyse SCT</h2>
<p class="text-sm font-medium text-on-surface-variant font-body tracking-wide uppercase">Évaluation des offres — Lot [numbLot]</p>
</div>
<button class="p-2 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Form Content -->
<form class="flex-1 flex flex-col gap-6 font-body">
<!-- Contextual Information -->
<div class="bg-surface-container-low p-5 rounded-xl space-y-5">
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Lot concerné</label>
<div class="input-ghost relative flex items-center">
<select class="input-field appearance-none pr-10 text-sm font-medium text-on-surface">
<option value="">Sélectionner un lot</option>
<option value="1">Lot 1 - Matériel Informatique</option>
<option selected="" value="2">Lot 2 - Mobilier de Bureau</option>
<option value="3">Lot 3 - Véhicules Utilitaires</option>
</select>
<span class="material-symbols-outlined absolute right-3 text-on-surface-variant pointer-events-none text-[20px]">expand_more</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Réception</label>
<div class="input-ghost relative flex items-center">
<input class="input-field text-sm font-medium text-on-surface" type="date"/>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Présentation</label>
<div class="input-ghost relative flex items-center">
<input class="input-field text-sm font-medium text-on-surface" type="date"/>
</div>
</div>
</div>
</div>
<!-- Analysis Details -->
<div class="bg-surface-container-low p-5 rounded-xl space-y-5">
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Attributaire Prévisionnel</label>
<div class="input-ghost relative flex items-center">
<select class="input-field appearance-none pr-10 text-sm font-medium text-on-surface">
<option value="">Sélectionner le fournisseur</option>
<option value="f1">TechCorp SA</option>
<option value="f2">Bureau Equipement Plus</option>
<option value="f3">Global Motors</option>
</select>
<span class="material-symbols-outlined absolute right-3 text-on-surface-variant pointer-events-none text-[20px]">expand_more</span>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Observations de la SCT</label>
<div class="input-ghost">
<textarea class="input-field min-h-[100px] resize-y text-sm leading-relaxed" placeholder="Saisir les remarques, réserves ou justifications concernant l'analyse technique et financière..."></textarea>
</div>
</div>
</div>
<!-- Ranking Table (Editorial Style) -->
<div class="bg-surface-container-low p-5 rounded-xl space-y-4">
<h3 class="text-sm font-bold font-headline text-secondary tracking-tight">Classement des offres</h3>
<div class="space-y-2">
<!-- Row 1 -->
<div class="bg-surface-container-lowest p-3 rounded-[10px] flex items-center justify-between shadow-ambient">
<div class="flex-1 space-y-1">
<p class="text-sm font-semibold text-on-surface">Bureau Equipement Plus</p>
<div class="flex items-center gap-3 text-xs text-on-surface-variant">
<span class="font-medium text-secondary">12 450 000 FCFA</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span>30 jours</span>
</div>
</div>
<div class="w-20 ml-4">
<div class="input-ghost flex items-center">
<span class="pl-3 text-xs text-on-surface-variant font-medium">Rang</span>
<input class="input-field text-center font-bold text-on-surface py-2 px-1 bg-transparent border-none focus:ring-0 w-full" max="10" min="1" type="number" value="1"/>
</div>
</div>
</div>
<!-- Row 2 -->
<div class="bg-surface-container-lowest p-3 rounded-[10px] flex items-center justify-between">
<div class="flex-1 space-y-1">
<p class="text-sm font-semibold text-on-surface">Global Office Solutions</p>
<div class="flex items-center gap-3 text-xs text-on-surface-variant">
<span class="font-medium text-secondary">13 100 000 FCFA</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span>45 jours</span>
</div>
</div>
<div class="w-20 ml-4">
<div class="input-ghost flex items-center">
<span class="pl-3 text-xs text-on-surface-variant font-medium">Rang</span>
<input class="input-field text-center font-bold text-on-surface py-2 px-1 bg-transparent border-none focus:ring-0 w-full" max="10" min="1" type="number" value="2"/>
</div>
</div>
</div>
</div>
</div>
<!-- Bottom Actions -->
<div class="mt-auto pt-6 flex flex-col gap-3 shrink-0">
<button class="btn-primary w-full py-3.5 px-6 font-semibold font-headline text-sm flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]">fact_check</span>
                    Valider le Rapport d'Analyse
                </button>
<button class="w-full py-3 px-6 font-semibold font-headline text-sm text-on-secondary-container bg-transparent hover:bg-surface-container-high rounded-[10px] transition-colors" type="button">
                    Annuler
                </button>
</div>
</form>
</aside>
</body></html>
