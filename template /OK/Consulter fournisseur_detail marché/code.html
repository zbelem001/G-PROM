<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Consulter un Fournisseur - G-PROM</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "outline": "#74777d",
                      "on-secondary-container": "#51647d",
                      "on-tertiary-container": "#5692ff",
                      "on-secondary-fixed": "#061d32",
                      "on-tertiary-fixed": "#001a42",
                      "secondary-fixed-dim": "#b4c8e4",
                      "on-error-container": "#93000a",
                      "tertiary-fixed": "#d8e2ff",
                      "surface-container": "#eeeef0",
                      "surface-container-highest": "#e2e2e4",
                      "surface-container-low": "#f3f3f5",
                      "background": "#f9f9fb",
                      "surface-tint": "#006a62",
                      "surface-container-lowest": "#ffffff",
                      "inverse-on-surface": "#f0f0f2",
                      "error": "#ba1a1a",
                      "on-error": "#ffffff",
                      "primary-fixed": "#96f3e7",
                      "primary-container": "#00332f",
                      "on-tertiary": "#ffffff",
                      "surface-variant": "#e2e2e4",
                      "on-surface": "#1a1c1d",
                      "on-primary": "#ffffff",
                      "surface": "#f9f9fb",
                      "surface-dim": "#d9dadc",
                      "secondary-fixed": "#d1e4ff",
                      "on-primary-fixed": "#00201d",
                      "surface-bright": "#f9f9fb",
                      "surface-container-high": "#e8e8ea",
                      "on-primary-container": "#43a399",
                      "tertiary-fixed-dim": "#adc6ff",
                      "inverse-primary": "#79d6cb",
                      "secondary-container": "#cde1fe",
                      "on-surface-variant": "#43474d",
                      "on-background": "#1a1c1d",
                      "tertiary-container": "#002b63",
                      "tertiary": "#00173c",
                      "primary": "#001c1a",
                      "on-secondary": "#ffffff",
                      "secondary": "#4c6078",
                      "outline-variant": "#c4c6cd",
                      "error-container": "#ffdad6",
                      "on-secondary-fixed-variant": "#35485f",
                      "on-primary-fixed-variant": "#00504a",
                      "primary-fixed-dim": "#79d6cb",
                      "on-tertiary-fixed-variant": "#004395",
                      "inverse-surface": "#2f3132"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Manrope", "sans-serif"
                      ],
                      "body": [
                              "Inter", "sans-serif"
                      ],
                      "label": [
                              "Inter", "sans-serif"
                      ]
              }
      },
          },
        }
      </script>
</head>
<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex overflow-hidden">
<!-- Global Background / Context -->
<div class="flex-1 ml-[240px] pt-24 p-8 relative">
<h1 class="text-3xl font-headline font-bold text-on-surface mb-6">Gestion des Consultations</h1>
<!-- Dummy background content for context -->
<div class="bg-surface-container-lowest p-6 rounded-[16px] shadow-[0_6px_24px_rgba(26,46,68,0.08)] opacity-50 blur-sm pointer-events-none">
<div class="h-8 bg-surface-container-high rounded w-1/4 mb-4"></div>
<div class="h-4 bg-surface-container-low rounded w-1/2 mb-2"></div>
<div class="h-4 bg-surface-container-low rounded w-1/3 mb-6"></div>
<div class="h-64 bg-surface-container-low rounded"></div>
</div>
</div>
<!-- NavigationDrawer (Side Panel) -->
<!-- Applying explicit JSON structural commands: slide-in-from-right duration-500 ease-out -->
<!-- Applying background: bg-white/95 dark:bg-slate-900/95 backdrop-blur-2xl -->
<!-- Applying shape: fixed right-0 top-0 h-full w-[450px] z-50 -->
<!-- Applying shadow: shadow-[-20px_0_40px_rgba(26,46,68,0.15)] -->
<!-- Applying typography shell: font-['Manrope'] text-slate-900 dark:text-slate-100 -->
<!-- Applying layout: flex flex-col p-10 gap-8 -->
<aside class="fixed right-0 top-0 h-full w-[450px] z-50 bg-surface-container-lowest/90 backdrop-blur-[20px] shadow-[-20px_0_40px_rgba(26,46,68,0.15)] flex flex-col p-10 gap-8 transform transition-transform duration-500 ease-out translate-x-0 font-headline text-on-surface border-l-0">
<!-- Header -->
<header class="mb-[32px] shrink-0">
<h2 class="text-[22px] font-bold text-on-surface mb-2 leading-tight">Consulter un Fournisseur</h2>
<p class="text-sm font-body text-on-surface-variant">Enregistrer une invitation à soumissionner</p>
</header>
<!-- Content Canvas -->
<div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
<!-- Info Block -->
<!-- Tonal shift definition instead of border for the main area, but using the specific request for info block -->
<!-- Note: Design System says "No High-Contrast Borders", and "1px solid borders are strictly prohibited for sectioning", but user explicitly requested a teal border for this specific info block. We will use a tonal border (ghost border) approach to satisfy both if possible, or lean towards the explicit request with low opacity. -->
<div class="bg-[#f0fdfb] rounded-[10px] p-4 mb-8 flex items-start gap-3 relative before:absolute before:inset-0 before:rounded-[10px] before:border before:border-primary-container before:opacity-15 pointer-events-none">
<span class="material-symbols-outlined text-primary-container shrink-0 mt-0.5" data-icon="info" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="text-sm font-body text-primary-container leading-relaxed">
                    Un fournisseur peut être consulté sur plusieurs lots distincts du même marché.
                </p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6 font-body">
<!-- Field: numbLot -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-on-surface" for="numbLot">Numéro de Lot</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-highest border-0 rounded-[10px] px-4 py-3 text-sm text-on-surface focus:ring-0 focus:bg-surface-container-lowest focus:outline-none transition-colors group" id="numbLot" name="numbLot">
<option disabled="" selected="" value="">Sélectionner un lot...</option>
<option value="lot1">Lot 01 - Matériel Informatique</option>
<option value="lot2">Lot 02 - Fournitures de Bureau</option>
<option value="lot3">Lot 03 - Mobilier</option>
</select>
<!-- Ghost border overlay for focus state simulation -->
<div class="absolute inset-0 rounded-[10px] border border-primary opacity-0 pointer-events-none transition-opacity peer-focus:opacity-20"></div>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Field: idFournisseur -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-on-surface" for="idFournisseur">Fournisseur</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant z-10" data-icon="search">search</span>
<!-- Simulating select with search using a datalist/input combo or stylized input for UI purposes -->
<input class="w-full bg-surface-container-highest border-0 rounded-[10px] pl-11 pr-4 py-3 text-sm text-on-surface focus:ring-0 focus:bg-surface-container-lowest focus:outline-none transition-colors peer placeholder:text-on-surface-variant/60" id="idFournisseur" name="idFournisseur" placeholder="Rechercher un fournisseur..." type="text"/>
<!-- Ghost border overlay -->
<div class="absolute inset-0 rounded-[10px] border border-primary opacity-0 pointer-events-none transition-opacity peer-focus:opacity-20"></div>
</div>
</div>
<!-- Field: DateConsultation -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-on-surface" for="DateConsultation">Date de Consultation</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-0 rounded-[10px] px-4 py-3 text-sm text-on-surface focus:ring-0 focus:bg-surface-container-lowest focus:outline-none transition-colors peer" id="DateConsultation" name="DateConsultation" type="date"/>
<!-- Ghost border overlay -->
<div class="absolute inset-0 rounded-[10px] border border-primary opacity-0 pointer-events-none transition-opacity peer-focus:opacity-20"></div>
<!-- Hide default calendar icon on webkit to style our own, or let native take over. We'll add a generic one for visual completeness if native is hidden via CSS, but keeping it simple for HTML output -->
</div>
</div>
</form>
</div>
<!-- Footer Actions -->
<footer class="mt-auto shrink-0 flex gap-4 pt-6 bg-surface-container-lowest/90 backdrop-blur-md">
<button class="flex-1 px-4 py-3 rounded-[10px] font-headline text-sm font-semibold text-on-secondary-container bg-transparent hover:bg-surface-container-high transition-colors" type="button">
                Annuler
            </button>
<!-- Primary CTA with "Liquidity Gradient" from design system -->
<button class="flex-[2] px-4 py-3 rounded-[10px] font-headline text-sm font-semibold text-white shadow-[0_4px_14px_rgba(26,46,68,0.12)] hover:shadow-[0_6px_20px_rgba(26,46,68,0.18)] transition-all transform hover:-translate-y-0.5" style="background: linear-gradient(135deg, #76d3c8 0%, #43a399 100%);" type="button">
                Enregistrer la Consultation
            </button>
</footer>
</aside>
<style>
        /* Custom Scrollbar for Drawer to maintain clean aesthetic */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--tw-colors-surface-container-highest);
            border-radius: 4px;
        }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb {
            background: var(--tw-colors-outline-variant);
        }
        
        /* Hide default calendar icon in some browsers to rely on custom if needed, or just let it be. Native inputs are acceptable unless complex custom UI requested. */
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
    </style>
</body></html>
